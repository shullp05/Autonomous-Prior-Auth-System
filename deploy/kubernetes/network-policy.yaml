apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: priorauth-default-deny
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: priorauth
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: priorauth-allow-local-model
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: priorauth
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ollama
      ports:
        - protocol: TCP
          port: 11434
