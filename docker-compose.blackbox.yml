services:
  priorauth:
    build:
      context: .
      args:
        REQUIREMENTS_FILE: requirements-docker-cpu.txt
    command: ["python", "batch_runner.py"]
    user: "appuser"
    network_mode: "none"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      PA_USE_DETERMINISTIC: "true"
      PA_LETTER_MODE: "deterministic"
      PA_OFFLINE_MODE: "true"
      PA_OFFLINE_ALLOW_LOCALHOST: "false"
      PA_OFFLINE_STRICT_UNKNOWN_HOST: "true"
      PA_OUTPUT_DIR: "/output"
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TRANSFORMERS_OFFLINE: "1"
      LANGCHAIN_TRACING_V2: "false"
      LANGSMITH_TRACING: "false"
      LANGSMITH_DISABLED: "true"
      ANONYMIZED_TELEMETRY: "false"
    volumes:
      - ./output:/output
      - ./chroma_db:/chroma_db
      - ./artifacts/models:/models:ro
